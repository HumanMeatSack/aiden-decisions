name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest tests.test_decisions tests.test_decision_workflows tests.test_decision_calibration tests.test_decision_client tests.test_decision_hooks tests.test_decision_server tests.test_standalone
      - run: aiden-decisions preflight 'turn the living room TV on'
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[mcp]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: aiden-decisions preflight 'turn the living room TV on'
